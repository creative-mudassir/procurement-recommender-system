version: "3.9"
services:
  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - /app/node_modules
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
